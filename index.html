<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte Power BI PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    #reporte {
      background: white;
      width: 210mm;
      min-height: 297mm;
      padding: 20mm;
      margin: auto;
      box-sizing: border-box;
    }

    button {
      margin: 20px auto;
      display: block;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button onclick="generarPDF()">Descargar PDF</button>

  <div id="reporte">
    <h1>Resumen Ejecutivo</h1>
    <div id="contenido"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const html = params.get("contenido") || "<p>No se recibió contenido desde Power BI.</p>";

    document.getElementById("contenido").innerHTML = decodeURIComponent(html);

    function generarPDF() {
      html2pdf()
        .from(document.getElementById("reporte"))
        .set({
          margin: 0,
          filename: "reporte-powerbi.pdf",
          html2canvas: { scale: 2 },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        })
        .save();
    }
  </script>

</body>
</html>
