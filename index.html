<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reporte Power BI PDF</title>

  <style>

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

body {
  font-family: Arial, sans-serif;
  background: white;
  padding: 20px;
  margin: 0;

  display: flex;
  justify-content: center;
}
#reporte {
  background: white;
  width: 180mm;
  min-height: 260mm;

  padding: 10mm;

  box-sizing: border-box;

  overflow-wrap: break-word;
}

    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .botones {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    @media print {

      button,
      .botones {
        display: none;
      }

      body {
        background: white;
        padding: 0;
        margin: 0;
      }

      #reporte {
        width: auto;
        padding: 0;
        margin: 0;
        box-shadow: none;
      }

    }

  </style>

</head>

<body>

  <div class="botones">

    <button onclick="window.print()">
      Imprimir / Guardar PDF
    </button>

  </div>

  <div id="reporte">

    <div id="contenido"></div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const html =
      params.get("contenido") ||
      "<h1>Sin contenido</h1><p>No se recibió contenido desde Power BI.</p>";

    document.getElementById("contenido").innerHTML =
      html;

  </script>

</body>

</html>
