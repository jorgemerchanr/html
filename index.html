<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reporte Power BI PDF</title>

  <style>

    @page {
      size: A4;
      margin: 10mm;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      margin: 0;
    }

    #reporte {
      background: white;
      width: 190mm;
      min-height: auto;
      padding: 12mm;
      margin: auto;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      overflow-wrap: break-word;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .botones {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 12px;
    }

    @media print {

      button {
        display: none;
      }

      body {
        background: white;
        margin: 0;
        padding: 0;
      }

      #reporte {
        width: auto;
        min-height: auto;
        padding: 0;
        margin: 0;
        box-shadow: none;
        background: white;
      }

    }

  </style>

</head>

<body>

  <div class="botones">

    <button onclick="window.print()">
      Imprimir / Guardar PDF
    </button>

  </div>

  <div id="reporte">

    <div id="contenido"></div>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const html =
      params.get("contenido") ||
      "<h1>Sin contenido</h1><p>No se recibió contenido desde Power BI.</p>";

    document.getElementById("contenido").innerHTML =
      html;

  </script>

</body>

</html>
